                link:{
                    mobileWebUrl:url,
                    webUrl:url
                }
            }
        });
    });

<script>
  function updateLayoutHeight() {
      const header = document.querySelector('.top_nav_box');
      if (!header) return;
      document.documentElement.style.setProperty(
          '--ap-header-height',
          `${header.offsetHeight - 1}px`
      );
  }

  document.addEventListener('DOMContentLoaded', () => {
      updateLayoutHeight();

      // 폰트 로드 완료 후 재측정 (FOUT로 인한 높이 변화 반영)
      if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(updateLayoutHeight);
      }

      const header = document.querySelector('.top_nav_box');
      if (header) {
          let rafId = null;
          const ro = new ResizeObserver(() => {
              if (rafId) cancelAnimationFrame(rafId);
              rafId = requestAnimationFrame(updateLayoutHeight);
          });
          ro.observe(header);
      }

      window.addEventListener('resize', updateLayoutHeight);
  });

  const topBtn = document.getElementById('topBtn');
  const progressCircle = document.getElementById('topProgress');
  const CIRCUMFERENCE = 2 * Math.PI * 23; // r=23

  let topBtnTicking = false;

  function updateProgress(){
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const ratio = docHeight > 0 ? scrollTop / docHeight : 0;

    const offset = CIRCUMFERENCE * (1 - ratio);
    progressCircle.style.strokeDashoffset = offset;

    // 일정 스크롤 이후에만 버튼 노출 (예: 300px)
    topBtn.classList.toggle('visible', scrollTop > 300);

    topBtnTicking = false;
  }

  window.addEventListener('scroll', ()=>{
    if(!topBtnTicking){
      requestAnimationFrame(updateProgress);
      topBtnTicking = true;
    }
  }, { passive:true });

  topBtn.addEventListener('click', ()=>{
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  updateProgress(); // 초기 실행
</script>
