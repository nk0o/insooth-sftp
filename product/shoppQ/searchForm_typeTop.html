<div module="product_searchdata" class="ap-searchTop">
  <!--@css(/css/module/product/searchdata.css)-->
  <section class="ap-container--narrow">
    <form class="searchField ap-searchTop__field" id="{$searchkeyword_form}" action="/product/search.html" method="get">
      <h2 class="ap-text--h1 ap-searchTop__title"><strong>"{$searchdata_keywordform}"</strong> 검색결과</h2>
    </form>
  </section><!-- //ap-container--narrow -->

  <div module="product_searchdata" id="searchContent" class="section {$filter_class}">
    <!--@css(/css/module/product/searchdata.css)-->
    <form class="searchCondition" id="{$searchdata_form}" name="" method="get">
      <div><input type="hidden" name="keyword" id="{$searchdata_keyword_hidden}" /></div>
      <div class="searchArea" id="ec-searchdata-area">
        <table>
          <caption>검색조건</caption>
          <colgroup>
            <col style="width:157px;">
            <col style="width:auto;">
          </colgroup>
          <tbody>
            <tr module="product_SearchFilterList">
              <th scope="row" class="title">{$filter_name}</th>
              <td class=" {$filter_type}">
                <div class="cell">
                  <ul module="product_filterform" class="content">
                    <li class=" {$filter_class}">{$filter_value}</li>
                    <li class="{$filter_class}">{$filter_value}</li>
                  </ul>
                  <div class="withinInput {$within_input_display|display}">{$within_input} <button
                      type="button" class="btnResearch">검색</button>{$within_suggest}</div>
                  <div class="priceInput {$price_input_display|display}">직접입력 {$price_input} <span
                      class="btnPriceSearch"><a href="#none" id="{$searchdata_submit}">검색<img
                          src="//img.echosting.cafe24.com/skin/base_ko_KR/product/btn_price_search.gif"
                          alt="검색" /></a></span></div>
                  <div class="slider {$price_slider_display|display}">{$price_slider}</div>
                  <p class="value {$price_slider_display|display}">{$price_txt}</p>
                  <div class="extend">
                    <button type="button"
                      class="btnExtend ec-searchdata-option-title">펼치기/열기</button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>
    <div class="display_tablet_only"><button type="button" class="btnSubmit gFull" id="{$searchdata_submit}">검색하기</button></div>
  </div>

  <div class="ap-searchTop__result searchResult">
    <div class="ap-container--narrow">
      <div class="function">
        <p class="prdCount">총&nbsp;<strong>{$total_count}</strong>개</p>
        <div class="sort">
          <div module="product_searchdata">
            <div class="searchOrder">{$searchOrderby}</div>
          </div>
        </div>
      </div>
    </div><!-- //ap-container--narrow -->
  </div><!-- //ap-searchTop__result -->
  <div class="ap-empty {$search_fail_display|display}">
    <div class="ap-empty__icon"><!--@import(/svg/icon-empty.html)--></div>
    <div class="ap-empty__title">검색 결과가 없습니다</div>
    <div class="ap-empty__desc">다른 키워드로 다시 검색해보세요.<br />
      두 단어 이상의 검색어인 경우, 띄어쓰기를 확인해 보세요.
    </div>
    <a href="/product/list.html?cate_no=49" class="ap-btn ap-btn--outline ap-btn--sm">전체 상품 보기</a>
  </div>
</div><!-- //ap-searchTop -->
